<style>

</style></head><body>
<div data-hf-id="hf-zklw" id="root" data-composition-id="main" data-duration="21.9" data-width="1920" data-height="1080">

<img data-hf-id="hf-aa6g" id="end-logo" src="assets/warden-wordmark-light.svg" alt="Warden"><section data-hf-id="hf-3nug" id="end" class="shot" aria-label="Download Warden for free"><h2 data-hf-id="hf-gm4j" id="end-action" class="headline"><span data-hf-id="hf-ezih" id="end-action-fill" aria-hidden="true"></span><span data-hf-id="hf-qzo9" id="end-action-label"><span data-hf-id="hf-r919" id="end-download">Download for free</span></span><svg data-hf-id="hf-qazc" id="end-action-icon" viewBox="0 0 64 64" fill="none" aria-hidden="true"><g data-hf-id="hf-ogii" id="end-arrow"><path data-hf-id="hf-0t0h" d="M32 8V39M19 27L32 40L45 27" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g><path data-hf-id="hf-h0fh" d="M10 43V55H54V43" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></svg></h2><p data-hf-id="hf-ywqd" class="end-detail" id="end-open">Open source. Free for everyone.</p><p data-hf-id="hf-p1ai" class="end-detail" id="end-platforms"><span data-hf-id="hf-fgmu">macOS</span><i data-hf-id="hf-wt6k"></i><span data-hf-id="hf-djna">Windows</span><i data-hf-id="hf-zeb8"></i><span data-hf-id="hf-8fih">Linux</span></p><p data-hf-id="hf-4ykd" class="end-detail" id="end-url">github.com/Wardenlabs/warden</p></section></div>
<script type="module">
import * as THREE from './assets/vendor/three.module.js';
await document.fonts.load('600 120px WardenDisplay');
const hookCanvas=document.getElementById('hook'),hook=window.createWardenHookV11(hookCanvas);
const workCanvas=document.getElementById('workbench'),work=window.createWardenWorkbenchV11(workCanvas);
const endCanvas=document.getElementById('end-card'),endLogoCanvas=document.getElementById('end-logo-3d');
const endLogoFilm=window.createWardenEndLogo({THREE,canvas:endLogoCanvas,width:1920,height:1080});
const endFilm=window.createWardenEndScene({canvas:endCanvas,logoCanvas:endLogoCanvas,logoFilm:endLogoFilm,width:1920,height:1080});
const picture=document.getElementById('picture'),c=picture.getContext('2d');
const stageA=document.createElement('canvas'),stageB=document.createElement('canvas');
for(const stage of [stageA,stageB]){stage.width=1920;stage.height=1080}
const end=document.getElementById('end'),endLogo=document.getElementById('end-logo');
const duration=21.9,clamp=n=>Math.max(0,Math.min(1,n)),ease=n=>{n=clamp(n);return n*n*(3-2*n)};
const beats=[{name:'hook',start:0,end:3.98,span:3.98},{name:'policy',start:3.98,end:8.82,span:7},{name:'tools',start:8.82,end:14.32,span:5.8},{name:'proof',start:14.32,end:17.98,span:4.5},{name:'outro',start:17.98,end:21.9,span:3.92}];
function drawScene(ctx,seconds,forced){
 const b=forced||beats.find(x=>seconds<x.end)||beats[4];
 const local=clamp((seconds-b.start)/(b.end-b.start))*b.span;
 ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.fillStyle='#081119';ctx.fillRect(0,0,1920,1080);
 if(b.name==='outro'){endFilm.renderAt(24.1+seconds-17.98);ctx.drawImage(endCanvas,0,0);return;}
 if(b.name==='hook'){hook.renderAt(local);ctx.drawImage(hookCanvas,0,0);return;}
 work.renderAt(local,b.name);ctx.drawImage(workCanvas,0,0);
 ctx.fillStyle='#f4f2eb';ctx.font='620 88px WardenDisplay,Arial';
 const heading=b.name==='policy'?(local<4.4?'Tell Warden what to protect.':'You choose what goes live.'):b.name==='tools'?'Their tools. Your rules.':local<2.6?'Keep the client file private.':'Let public work keep moving.';
 ctx.fillText(heading,100,157);
}
function renderFrame(seconds){
 const t=Math.max(0,Math.min(duration,Number(seconds)||0));
 const cut=beats.slice(1,4).find(b=>t>=b.start-.14&&t<b.start+.22);
 if(cut){
  const p=ease((t-cut.start+.14)/.36),prev=beats[beats.indexOf(cut)-1];
  drawScene(stageA.getContext('2d'),Math.min(t,cut.start-.001),prev);drawScene(stageB.getContext('2d'),Math.max(t,cut.start),cut);
  c.setTransform(1,0,0,1,0,0);c.fillStyle='#081119';c.fillRect(0,0,1920,1080);
  if(cut.name==='policy'){
   // Follow the policy boundary as its metal edge opens the manager's workbench.
   c.drawImage(stageA,0,0);const x=1920*(1-p);c.save();c.beginPath();c.rect(x,0,1920-x,1080);c.clip();c.drawImage(stageB,0,0);c.restore();
   c.fillStyle='#d6dfe2';c.fillRect(x-2,0,4,1080);
  }else{
   // One continuous strip preserves direction and speed as the workspace changes.
   c.save();c.translate(-1920*p,0);c.drawImage(stageA,0,0);c.drawImage(stageB,1920,0);c.restore();
  }
 }else drawScene(c,t);
 const outroTime=t>=17.98?24.1+t-17.98:0;
  // The logo and wordmark form one lockup before the download action lands.
  end.style.opacity=outroTime>=24.1?'1':'0';
  end.style.clipPath='none';end.style.color='#f4f2eb';
  const outroOut=n=>1-Math.pow(1-clamp(n),4);
  const wordmark=outroOut((outroTime-24.46)/.25);
  endLogo.style.opacity=String(wordmark);endLogo.style.clipPath='none';endLogo.style.filter='none';
  gsap.set(endLogo,{x:30*(1-wordmark),y:0,scale:1});
  const action=outroOut((outroTime-25.16)/.25);
  gsap.set('#end-action',{y:16*(1-action),scale:1,opacity:outroTime>=25.16?1:0,transformOrigin:'960px 854px'});
  gsap.set('#end-action-fill',{scaleY:action,transformOrigin:'50% 100%'});
  const actionText=outroOut((outroTime-25.21)/.20);
  gsap.set('#end-download',{y:80*(1-actionText),opacity:1});
  gsap.set('#end-action-icon',{opacity:actionText});
  const arrowTravel=outroOut((outroTime-25.21)/.20);
  gsap.set('#end-arrow',{y:-13*(1-arrowTravel)});
  const platform=outroOut((outroTime-25.78)/.22);
  gsap.set('#end-platforms',{y:12*(1-platform),opacity:platform});
  const source=outroOut((outroTime-26.20)/.24);
  gsap.set('#end-open',{x:0,y:9*(1-source),opacity:source});
  const link=outroOut((outroTime-25.21)/.23);
  gsap.set('#end-url',{y:0,opacity:link});

}
const tl=gsap.timeline({paused:true});
tl.to({time:0},{time:duration,duration,ease:'none'},0);
tl.eventCallback('onUpdate',()=>renderFrame(tl.time()));
window.addEventListener('hf-seek',event=>renderFrame(event.detail.time));
window.__wardenBeatTimes=beats.map(b=>b.start);window.__wardenV11Beats=beats;
window.__timelines=window.__timelines||{};window.__timelines.main=tl;
renderFrame(0);
</script></body></html>
